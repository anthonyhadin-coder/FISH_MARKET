name: CI — Quality Gate

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev]

# Minimal default permissions — scoped per-job below
permissions:
  contents: read

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Secret Scanning (Gitleaks)
  # ─────────────────────────────────────────────
  secret-scan:
    name: 🔐 Secret Scan
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 1: Dependency Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: 📦 Dependency Audit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────
  # JOB 2: TypeScript Type Check
  # ─────────────────────────────────────────────
  type-check:
    name: 🔷 TypeScript Check
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx turbo run type-check

  # ─────────────────────────────────────────────
  # JOB 3: Client — ESLint + Vitest
  # ─────────────────────────────────────────────
  lint-and-test-client:
    name: 🔍 Client — Lint & Unit Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: cd ${{ github.workspace }} && npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Run Vitest unit tests
        run: npm run test
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-client-id

  # ─────────────────────────────────────────────
  # JOB 4: Server — ESLint + Vitest + Supertest
  # ─────────────────────────────────────────────
  lint-and-test-server:
    name: 🔍 Server — Lint & Integration Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: fish_market_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: cd ${{ github.workspace }} && npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Initialize Test Database
        run: npx -y tsx scripts/initDb.ts
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/fish_market_test

      - name: Verify .env.example is complete
        run: |
          node -e "
            const example = require('fs').readFileSync('../../.env.example', 'utf8');
            const required = [
              'DATABASE_URL','REDIS_URL','JWT_SECRET',
              'REFRESH_TOKEN_SECRET','CLIENT_URL',
              'GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET',
              'SENTRY_DSN','VAPID_PUBLIC_KEY'
            ];
            const missing = required.filter(k => !example.includes(k));
            if (missing.length) {
              console.error('Missing from .env.example:', missing);
              process.exit(1);
            }
            console.log('✅ .env.example contains all required variables');
          "

      - name: Run Vitest + Supertest integration tests
        run: npm run test
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/fish_market_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-minimum-32-chars
          CLIENT_URL: http://127.0.0.1:3000
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          PORT: 5000
          ALLOWED_ORIGINS: http://127.0.0.1:3000

  # ─────────────────────────────────────────────
  # JOB 5: Visual Snapshot Update (On Push to Main Only)
  # ─────────────────────────────────────────────
  update-snapshots:
    name: 📸 Update Visual Snapshots
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    needs: [lint-and-test-client, lint-and-test-server]
    # Scoped write permission ONLY for this job (snapshot commits)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Services
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait db redis
        env:
          MYSQL_ROOT_PASSWORD: password
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-minimum-32-chars

      - name: Initialize Test Database
        run: cd apps/backend && npx -y tsx scripts/initDb.ts
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/fish_market

      - name: Build client
        run: |
          cd $GITHUB_WORKSPACE/apps/frontend
          npm run build
          cp -r .next/static .next/standalone/apps/frontend/.next/static
          cp -r public .next/standalone/apps/frontend/public
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api

      - name: Start backend server
        run: cd $GITHUB_WORKSPACE/apps/backend && npm run dev &
        env:
          NODE_ENV: development
          PORT: 5000
          CLIENT_URL: http://127.0.0.1:3000
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-minimum-32-chars
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/fish_market
          REDIS_URL: redis://127.0.0.1:6379

      - name: Start frontend client
        run: |
          cd $GITHUB_WORKSPACE/apps/frontend/.next/standalone
          PORT=3000 HOSTNAME=0.0.0.0 node apps/frontend/server.js &
        env:
          NODE_ENV: production
          PORT: 3000

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:5000/health --timeout 60000

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Update Snapshots
        run: npx playwright test apps/frontend/tests/e2e/visual.test.ts --update-snapshots --config apps/frontend/playwright.config.ts
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:5000/api

      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/tests/e2e/visual.test.ts-snapshots/
          git diff --staged --quiet && echo "No snapshot changes" || \
            (git commit -m "chore: update visual snapshots [skip ci]" && git push)

  # ─────────────────────────────────────────────
  # JOB 6: Playwright E2E Tests
  # ─────────────────────────────────────────────
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    needs: [update-snapshots]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: fish_market_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize Test Database
        run: cd apps/backend && npx -y tsx scripts/initDb.ts
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/fish_market_test

      - name: Build client
        run: |
          cd $GITHUB_WORKSPACE/apps/frontend
          npm run build
          cp -r .next/static .next/standalone/apps/frontend/.next/static
          cp -r public .next/standalone/apps/frontend/public
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:5000/api

      - name: Start backend server
        run: cd $GITHUB_WORKSPACE/apps/backend && npm run dev &
        env:
          NODE_ENV: development
          PORT: 5000
          CLIENT_URL: http://127.0.0.1:3000
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-minimum-32-chars
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/fish_market_test
          REDIS_URL: redis://127.0.0.1:6379

      - name: Start frontend client
        run: |
          cd $GITHUB_WORKSPACE/apps/frontend/.next/standalone
          PORT=3000 HOSTNAME=0.0.0.0 node apps/frontend/server.js &
        env:
          NODE_ENV: production
          PORT: 3000

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:5000/health --timeout 120000

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Run Playwright tests
        run: npx playwright test apps/frontend/tests/e2e --config apps/frontend/playwright.config.ts
        env:
          BASE_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:5000/api

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
