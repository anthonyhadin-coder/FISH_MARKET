apiVersion: v2
name: fish-market
description: A Helm chart for Deep Ocean Fish Market Platform

type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: mysql
    version: 9.15.1
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: redis
    version: 18.14.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
