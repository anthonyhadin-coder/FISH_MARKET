name: fish-market-prod

services:
  db:
    image: mysql:8.0.36
    container_name: fm_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: fish_market
    volumes:
      - mysql_data:/var/lib/mysql
    # No ports exposed — only reachable from within the stack
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.2-alpine
    container_name: fm_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?required} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: fm_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?required}
      CLIENT_URL: ${CLIENT_URL:?required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?required}
      SENTRY_DSN: ${SENTRY_DSN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_EMAIL: ${VAPID_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  frontend:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
    container_name: fm_frontend_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  nginx:
    image: nginx:1.27-alpine
    container_name: fm_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  mysql_data:
  redis_data:
  nginx_certs:
